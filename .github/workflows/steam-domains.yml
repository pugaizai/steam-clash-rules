name: Refresh Steam domains

on:
  schedule:
    # 每月 1 日 03:00 UTC（北京时间 11:00）
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      runner:
        description: '运行节点。默认 GitHub 托管（境外，不含 GFW，只验证域名存活）；想让 md 的可达统计贴近国内网络，填国内自托管 runner 的 label。steam-domains.yaml 始终由本地生成，与本工作流无关'
        required: false
        default: 'ubuntu-latest'

permissions:
  contents: write

concurrency:
  group: steam-domains
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect Steam domains from rule sets
        run: |
          set -o pipefail
          node scripts/collect.mjs | tee collect.log

      - name: Probe domains and regenerate steam-domains.md
        # 只刷新 steam-domains.md；steam-domains.yaml 由维护者本地探测生成，CI 不生成也不提交
        env:
          PROBE_NODE: ${{ runner.name }}
          PROBE_CONCURRENCY: '8'
          PROBE_TIMEOUT_MS: '8000'
        run: |
          set -o pipefail
          node scripts/build.mjs | tee build.log

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add steam-domains.md data/collected.json
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: refresh steam-domains ($(date -u +%F))"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          pass=$(grep -c '^PASS' build.log || true)
          fail=$(grep -c '^FAIL' build.log || true)
          {
            echo "### 规则集采集"
            echo
            echo '```'
            grep -E '^(OK|FAIL)' collect.log || echo "采集未运行"
            echo '```'
            echo
            echo "### 直连探测"
            echo
            echo "通过 ${pass}　未通 ${fail}"
            echo
            echo '```'
            grep -E '^(PASS|FAIL)' build.log | tail -n 60 || true
            echo '```'
            echo
            echo "### 规则集"
            echo
            echo '`steam-domains.yaml` 由本地运行 `node scripts/build.mjs --yaml` 生成，本工作流不更新它。'
          } >> "$GITHUB_STEP_SUMMARY"
